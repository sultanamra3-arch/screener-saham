name: Update data kripto

on:
  schedule:
    # Tiap jam, menit 23 (jam 00.23 UTC = 07.23 WIB: pertama setelah candle harian ditutup -> ringkasan pagi).
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kripto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang paket
        run: pip install -r requirements.txt

      - name: Ambil harga dan hitung metode kripto
        run: python scripts/fetch_kripto.py

      - name: Pesan Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_kripto.py || echo "Pesan Telegram gagal (data tetap disimpan)"

      - name: Kirim salinan ke chartflow.my.id/app/kripto (bila FTP sudah diatur)
        if: env.FTP_SERVER != ''
        run: |
          python scripts/build_chartflow_app.py kripto out_app
          sudo apt-get install -y -qq lftp > /dev/null
          LFTP_PASSWORD="$FTP_PASSWORD" lftp -c "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30; \
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\"; \
            mkdir -p -f ${FTP_DIR:-.}/_appfiles/kripto; mirror -R --parallel=4 out_app ${FTP_DIR:-.}/_appfiles/kripto" || echo "Kirim FTP gagal"
          rm -rf out_app out_app_pub

      - name: Simpan ke repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kripto/data
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -q -m "Update data kripto $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q && exit 0
            sleep $((i * 7))
          done
          exit 1
